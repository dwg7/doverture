<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doverture — 北海道の建物フットプリント突き合わせ</title>
    <!-- Open MCT 4.3.1 (unpkg)。バージョンを変える時は dist/openmct.js と
         dist/espressoTheme.css の両方の実在を curl -sI で確認してから固定する。 -->
    <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.1/dist/espressoTheme.css" />
    <link rel="stylesheet" href="./vendor/do/style.css" />
  </head>
  <body class="tm-dark">
    <script>
      // CDN 経由では検索インデクサの SharedWorker がクロスオリジンでブロックされるため、
      // 同期フォールバックに倒す（tabularmaps/do・kikimimi・sas0 と同じ回避策）。
      window.SharedWorker = undefined;
    </script>
    <script src="https://unpkg.com/openmct@4.3.1/dist/openmct.js"></script>
    <div id="app"></div>
    <script src="./vendor/do/tabularmap.js"></script>
    <script src="./vendor/do/openmct-plugin.js"></script>
    <script src="./doverture-sources.js"></script>
    <script>
      (function () {
        const script = document.querySelector('script[src*="openmct.js"]');
        if (script) openmct.setAssetPath(script.src.replace(/openmct\.js(?:\?.*)?$/, ''));
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.MyItems());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.install(openmct.plugins.Espresso());
        openmct.install(openmct.plugins.Notebook());
        openmct.install(TabularMapsPlugin({
          dataUrl: './vendor/do/data/',
          includeNorthernTerritoriesVillages: true,
          sources: window.DOVERTURE_SOURCES
        }));
        openmct.start('#app');
      })();
    </script>
  </body>
</html>
